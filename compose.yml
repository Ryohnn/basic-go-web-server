name: go-web-server

services:
    app:
        container_name: go-app
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - .:/app
        working_dir: /app
        command: air
        ports:
            - "80:8080"
        networks:
            - go_network

    db:
        container_name: go-db
        image: postgres:18-trixie
        env_file:
            - .env
        ports:
            - "5432:5432"
        volumes:
            - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
            - go-db-data:/var/lib/postgresql
        networks:
            - go_network

    adminer:
        container_name: go-adminer
        image: adminer
        restart: always
        ports:
            - "8081:8080"
        networks:
            - go_network

volumes:
    go-db-data:

networks:
    go_network:
        driver: bridge
