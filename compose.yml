name: go-web-server

services:
    app:
        container_name: go-app
        build:
            context: .
            dockerfile: Dockerfile
            target: dev
        env_file:
            - .env.dev
        volumes:
            - .:/app
        working_dir: /app
        command: air
        ports:
            - "80:8080"
        networks:
            - ryan-network

    db:
        container_name: go-db
        image: postgres:18-trixie
        env_file:
            - .env.dev
        ports:
            - "5432:5432"
        volumes:
            - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
        networks:
            - ryan-network

    adminer:
        container_name: go-adminer
        image: adminer
        restart: always
        ports:
            - "8081:8080"
        networks:
            - ryan-network

networks:
    ryan-network:
        name: ryan-network
        external: true
