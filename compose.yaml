name: go-web-server

x-env-dev: &env-dev
  env_file:
    - .env.dev

x-local-network: &local-network
  networks:
    - ryan-network

services:
    app:
        container_name: go-app
        build:
            context: .
            dockerfile: Dockerfile
            target: dev
        volumes:
            - .:/app
        working_dir: /app
        command: air
        ports:
            - "80:8080"
        <<: [*env-dev, *local-network]

    db:
        container_name: go-db
        image: postgres:18-trixie
        ports:
            - "5432:5432"
        # volumes:
        #     - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
        <<: [*env-dev, *local-network]

    adminer:
        container_name: go-adminer
        image: adminer
        restart: always
        ports:
            - "8081:8080"
        <<: [*local-network]

    floci:
        container_name: go-floci
        image: floci/floci:2.1.0-compat
        ports:
        - "4566:4566"
        volumes:
        - ./floci-data:/app/data
        - ./docker/floci/init.sh:/etc/floci/init/ready.d/init.sh
        environment:
            FLOCI_STORAGE_MODE: hybrid
            AWS_ACCESS_KEY_ID: dev
            AWS_SECRET_ACCESS_KEY: dev
            AWS_DEFAULT_REGION: eu-west-2
            AWS_ENDPOINT_URL: http://localhost:4566
            BUCKET: pixul-images
        <<: [*local-network]

networks:
    ryan-network:
        name: ryan-network
        external: true
